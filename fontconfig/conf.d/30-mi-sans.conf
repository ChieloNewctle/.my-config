<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>MiSans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Segoe UI</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Arial</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Tahoma</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>SimHei</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>&#x9ED1;&#x4F53;</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Helvetica Neue</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>San Francisco</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Hiragino Sans GB</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>STHeiti</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>WenQuanYi Micro Hei</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Ubuntu</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>&#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>PingFang SC</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>PingFang TC</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>PingFang HK</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Roboto</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Google Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Google Sans Flex</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>YouTube Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK SC</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK TC</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK HK</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK JP</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans CJK KR</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>HarmonyOS Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>HarmonyOS Sans SC</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Open Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>MiSans</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
