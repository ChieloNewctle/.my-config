<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono Chielo</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Consolas</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Courier New</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Lucida Console</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>NSimSun</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>&#x65B0;&#x5B8B;&#x4F53;</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Menlo</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Monaco</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>SF Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Courier</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>DejaVu Sans Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Ubuntu Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrains Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Fira Code</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Hack</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Source Code Pro</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Cascadia Code</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Cascadia Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Inconsolata</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Roboto Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Google Sans Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Google Sans Code Monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>IBM Plex Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>GitLab Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono Chielo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Maple Mono Chielo</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Symbols Nerd Font Mono</string>
      <string>Noto Color Emoji</string>
      <string>MiSans</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
